<app-navbar></app-navbar>

<div class="container mt-4">
  <div class="row mb-4">
    <div class="col-md-6">
      <h2>Gestión de Usuarios</h2>
    </div>
    <div class="col-md-6 text-end">
      <button class="btn btn-info me-2" (click)="abrirUploadExcel()" *ngIf="!mostrarForm && !mostrarUpload">
        📊 Cargar Excel
      </button>
      <button class="btn btn-success" (click)="abrirFormulario()" *ngIf="!mostrarForm && !mostrarUpload">
        + Nuevo Usuario
      </button>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div *ngIf="mostrarUpload" class="card mb-4">
    <div class="card-body">
      <app-upload-excel 
        (cerrar)="cerrarUploadExcel()"
        (guardado)="usuariosSubidos()">
      </app-upload-excel>
    </div>
  </div>

  <div *ngIf="mostrarForm" class="card mb-4">
    <div class="card-body">
      <app-usuario-form 
        [usuario]="usuarioEditar"
        (cerrar)="cerrarFormulario()"
        (guardado)="usuarioGuardado()">
      </app-usuario-form>
    </div>
  </div>

  <div *ngIf="loading" class="text-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <div *ngIf="!loading && usuarios.length > 0" class="table-responsive">
    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Usuario</th>
          <th>Correo</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let usuario of usuarios">
          <td>{{ usuario.id }}</td>
          <td>{{ usuario.nombre }}</td>
          <td>{{ usuario.username }}</td>
          <td>{{ usuario.correo }}</td>
          <td>
            <button class="btn btn-sm btn-primary me-2" (click)="editar(usuario)">
              Editar
            </button>
            <button class="btn btn-sm btn-danger" (click)="eliminar(usuario.id)">
              Eliminar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!loading && usuarios.length === 0" class="alert alert-info">
    No hay usuarios registrados.
  </div>
</div>
