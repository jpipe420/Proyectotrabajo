<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Registro de Nuevo Usuario</h3>
                </div>
                <div class="card-body">
                    <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
                    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

                    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
                        
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre Completo</label>
                            <input id="nombre" type="text" formControlName="nombre" class="form-control" placeholder="Ej: Juan Pérez">
                            <div *ngIf="registerForm.get('nombre')?.invalid && registerForm.get('nombre')?.touched" class="text-danger small">
                                El nombre es obligatorio.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label">Nombre de Usuario</label>
                            <input id="username" type="text" formControlName="username" class="form-control" placeholder="nombre.usuario">
                            <div *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched" class="text-danger small">
                                El nombre de usuario es obligatorio.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo Electrónico</label>
                            <input id="correo" type="email" formControlName="correo" class="form-control" placeholder="ejemplo@correo.com">
                            <div *ngIf="registerForm.get('correo')?.invalid && registerForm.get('correo')?.touched" class="text-danger small">
                                Formato de correo inválido o campo obligatorio.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input id="password" type="password" formControlName="password" class="form-control" placeholder="Mínimo 6 caracteres">
                            <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="text-danger small">
                                La contraseña es obligatoria y debe tener al menos 6 caracteres.
                            </div>
                        </div>

                        <button 
                            type="submit" 
                            [disabled]="registerForm.invalid" 
                            class="btn btn-success w-100"
                        >
                            Registrarse
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
